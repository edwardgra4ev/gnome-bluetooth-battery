name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `gnome-extensions pack` segfaults on the runner (no session bus), so the
      # archive is assembled with plain zip from a fixed file list instead.
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Build extension
        run: |
          make zip
          unzip -l bluetooth-battery@gra4ev.shell-extension.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: bluetooth-battery@gra4ev.shell-extension.zip
          body_path: CHANGELOG.md
