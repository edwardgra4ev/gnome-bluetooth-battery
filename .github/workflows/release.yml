name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `gnome-extensions pack` segfaults on the runner (no session bus), so the
      # archive is assembled with plain zip from a fixed file list instead.
      - name: Build extension
        run: |
          ZIP="bluetooth-battery@gra4ev.shell-extension.zip"
          rm -f "$ZIP"
          zip -r "$ZIP" \
            metadata.json extension.js bluezClient.js indicator.js prefs.js stylesheet.css schemas
          unzip -l "$ZIP"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: bluetooth-battery@gra4ev.shell-extension.zip
          generate_release_notes: true
